# /etc/nginx/sites-available/pokelocation.waveplay.xyz (deploy/README.md). O certbot acrescenta o bloco 443.
map $http_upgrade $pokelocation_connection {
	default upgrade;
	''      '';
}

# Zonas no contexto http (este arquivo é incluído lá), com nome próprio: a VPS é compartilhada e só os location
# deste server as usam. Por IP real: o X-Forwarded-For de fora é ignorado ($binary_remote_addr).
limit_req_zone $binary_remote_addr zone=pokelocation_api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=pokelocation_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=pokelocation_conn:10m;

server {
	listen 80;
	listen [::]:80;
	server_name pokelocation.waveplay.xyz;

	# sem IP nem URI em log: a URI do callback do Google leva o code
	access_log off;
	error_log /var/log/nginx/error.log crit;
	client_max_body_size 1m;
	limit_req_status 429;
	limit_conn_status 429;
	# o app lê {"error":...}; a página HTML padrão viraria erro genérico
	error_page 429 = @pokelocation_429;

	location @pokelocation_429 {
		default_type application/json;
		return 429 '{"error":"rate_limited"}';
	}

	# libsignal-<versão>/libsignal_jni-<abi>.so.gz: imutáveis, com Range (retomada do download)
	location /static/ {
		alias /opt/pokelocation-static/;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# página inicial da tela de consentimento do Google
	location = / {
		return 302 https://github.com/ayranoliveira1/pokelocation;
	}

	location = /privacy {
		alias /opt/pokelocation-server/deploy/site/privacy.html;
		default_type "text/html; charset=utf-8";
	}

	# só para o healthcheck local do deploy, que fala direto com 127.0.0.1:8095
	location = /healthz {
		return 404;
	}

	location / {
		# só rajada grosseira: o limite fino é por usuário no servidor, e um CGNAT junta muitos apps no IP
		limit_req zone=pokelocation_api burst=100 nodelay;
		# cada app segura um WebSocket: o teto por IP tem de caber num CGNAT
		limit_conn pokelocation_conn 200;
		proxy_pass http://127.0.0.1:8095;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# sobrescreve o de fora: o servidor confia no último X-Forwarded-For (clientIP em internal/auth)
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $pokelocation_connection;
		proxy_read_timeout 90s;

		# login, register, refresh, Google: mais apertado; os proxy_set_header vêm do location de fora
		location /v1/auth/ {
			limit_req zone=pokelocation_auth burst=10 nodelay;
			proxy_pass http://127.0.0.1:8095;
		}
	}
}
