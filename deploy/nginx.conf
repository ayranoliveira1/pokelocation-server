# /etc/nginx/sites-available/pokelocation.waveplay.xyz (deploy/README.md). O certbot acrescenta o bloco 443.
map $http_upgrade $pokelocation_connection {
	default upgrade;
	''      '';
}

server {
	listen 80;
	listen [::]:80;
	server_name pokelocation.waveplay.xyz;

	# sem IP nem URI em log: a URI do callback do Google leva o code
	access_log off;
	error_log /var/log/nginx/error.log crit;
	client_max_body_size 1m;

	# libsignal-<versão>/libsignal_jni-<abi>.so.gz: imutáveis, com Range (retomada do download)
	location /static/ {
		alias /opt/pokelocation-static/;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location = /privacy {
		alias /opt/pokelocation-server/deploy/site/privacy.html;
	}

	location / {
		proxy_pass http://127.0.0.1:8095;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# sobrescreve o de fora: o servidor confia no último X-Forwarded-For (clientIP em internal/auth)
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $pokelocation_connection;
		proxy_read_timeout 90s;
	}
}
