name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./... # testcontainers usa o Docker do runner
      # sob -race o sync.Pool descarta itens de propósito: a contagem de alocações só vale sem ele
      - run: go test -run Allocs ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # commit de master: a v2.29.0 não lê o export data do Go 1.27
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.1-0.20261012130337-71577268350e ./...
